<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flood Aid Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #map { height: calc(100vh - 4rem); }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Header -->
    <header class="bg-blue-600 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold">Flood Aid & Resources Map</h1>
        <span class="text-sm bg-blue-700 px-3 py-1 rounded">Live Status</span>
    </header>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script>
        // Initialize the map centered somewhere (e.g., Dubai coordinates)
        const map = L.map('map').setView([25.2048, 55.2708], 11);

        // Add map tiles (the visual map layer)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Add a sample marker for an aid station
        const marker = L.marker([25.2048, 55.2708]).addTo(map);
        marker.bindPopup("<b>Central Aid Station</b><br>Supplies available here.").openPopup();
    </script>
</body>
</html>
